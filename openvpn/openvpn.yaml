---
apiVersion: v1
kind: Service
metadata:
  name: openvpn
  labels:
    app: openvpn
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 943
      name: server
      targetPort: 943
    - port: 443
      name: https
      targetPort: 443
    - port: 1194
      name: udp
      targetPort: 1194
      protocol: UDP
  selector:
    app: openvpn
---
#指定api版本标签
apiVersion: apps/v1
#定义资源的类型/角色，deployment为副本控制器
#此处资源类型可以是Deployment、Job、Ingress、Service等
kind: Deployment
#定义资源的元数据信息，比如资源的名称、namespace、标签等信息
metadata:
  #定义资源的名称，在同一个namespace空间中必须是唯一的
  name: openvpn
  namespace: default
  labels:
    app: openvpn
#定义deployment资源需要的参数属性，诸如是否在容器失败时重新启动容器的属性
spec:
  #定义副本数量
  replicas: 1
  #定义标签选择器
  selector:
    #定义匹配标签
    matchLabels:
      #需与后面的.spec.template.metadata.labels定义的标签保持一致
      app: openvpn
  #定义业务模板，如果有多个副本，所有副本的属性会按照模板的相关配置进行匹配
  template:
    metadata:
      #定义Pod副本将使用的标签，需与前面的.spec.selector.matchLabels定义的标签保持一致
      labels:
        app: openvpn
    spec:
      hostNetwork: true
      containers:
        - name: openvpn
          imagePullPolicy: IfNotPresent
          image: openvpn/openvpn-as:3.0.2-87c70987-Ubuntu24
          ports:
            - containerPort: 943
              name: server
            - containerPort: 443
              name: https
            - containerPort: 1194
              name: udp
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - MKNOD
          volumeMounts:
            - name: openvpn-storage-volume
              mountPath: /openvpn
      volumes:
        - name: openvpn-storage-volume
          persistentVolumeClaim:
            claimName: openvpn-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openvpn-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: default
  volumeMode: Filesystem