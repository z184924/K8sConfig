# 对应 docker-compose 中的 dashboard 服务（rocketmq-dashboard）
# compose 的 depends_on 在 k8s 中无对应物：dashboard 按需连接 namesrv，broker 未就绪时页面显示为空
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-dashboard
  namespace: default
  labels:
    app: rocketmq-dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  selector:
    app: rocketmq-dashboard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-dashboard
  namespace: default
  labels:
    app: rocketmq-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-dashboard
  template:
    metadata:
      labels:
        app: rocketmq-dashboard
    spec:
      containers:
        - name: dashboard
          image: apacherocketmq/rocketmq-dashboard:2.1.0
          imagePullPolicy: IfNotPresent
          env:
            # 对应 compose 的 JAVA_OPTS: -Drocketmq.namesrv.addr=rmqnamesrv:9876
            - name: JAVA_OPTS
              value: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
          ports:
            - containerPort: 8082
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
