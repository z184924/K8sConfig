# 对应 docker-compose 中的 proxy 服务（rmqproxy）
# compose 的 depends_on 在 k8s 中无对应物：proxy 启动后自动重连 namesrv
apiVersion: v1
kind: Service
metadata:
  name: rocketmq-proxy
  namespace: default
  labels:
    app: rocketmq-proxy
spec:
  type: ClusterIP
  ports:
    - name: remoting
      port: 8080
      targetPort: 8080
    # 5.x gRPC 客户端接入端口
    - name: grpc
      port: 8081
      targetPort: 8081
  selector:
    app: rocketmq-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketmq-proxy
  namespace: default
  labels:
    app: rocketmq-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rocketmq-proxy
  template:
    metadata:
      labels:
        app: rocketmq-proxy
    spec:
      containers:
        - name: proxy
          image: apache/rocketmq:5.3.2
          imagePullPolicy: IfNotPresent
          # 对应 compose 的 command: sh mqproxy
          command: ["sh", "mqproxy"]
          env:
            # 对应 compose 的 NAMESRV_ADDR=rmqnamesrv:9876
            - name: NAMESRV_ADDR
              value: "rocketmq-namesrv:9876"
          ports:
            - containerPort: 8080
              name: remoting
            - containerPort: 8081
              name: grpc
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
